[project]
name = "coe-overview"
version = "0.1.0"
description = "Weekly Correction-of-Errors prep aggregator"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.18.0",
    "httpx>=0.28.0",
    "tenacity>=8.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "mypy>=1.11.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "testcontainers[postgres]>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coe"]

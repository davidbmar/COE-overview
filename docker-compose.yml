services:
  postgres:
    image: postgres:16
    container_name: coe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coe
      POSTGRES_PASSWORD: coe
      POSTGRES_DB: coe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coe -d coe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    driver: local
